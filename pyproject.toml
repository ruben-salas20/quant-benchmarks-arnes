[project]
name = "arnes"
version = "0.1.0"
description = "Mide prefill, decode, tiempo al primer token y memoria de modelos GGUF sobre llama.cpp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "carga/LICENSE-llama.cpp"]
authors = [
    { name = "Ruben Salas", email = "rubend.salasp@uqvirtual.edu.co" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
arnes = "arnes:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
